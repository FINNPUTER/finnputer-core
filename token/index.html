<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Token scan | FINNPUTER CORE</title>
<meta name="description" content="Scan any Solana token: clusters, snipers, fresh wallets, forwarded supply, holders and liquidity.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/core.css">
</head>
<body>
<div class="wrap">

<header>
  <div class="eyebrow">TOKEN SCAN</div>
  <h1>Paste an address.<br>See who is behind it.</h1>
  <p class="sub">Clusters, snipers, fresh wallets, forwarded supply, holder concentration and liquidity. Paste any address: the chain is worked out by asking which one actually trades it, not by guessing from the format.</p>
  <div class="cmd">
    <input id="mint" autocomplete="off" spellcheck="false" placeholder="token address, any chain">
    <button id="scan">SCAN</button>
  </div>
  <div class="trace" id="trace">
    <div class="trace-hd"><span class="dot"></span><span id="traceTitle">WORKING</span></div>
    <div class="trace-body" id="traceBody"></div>
  </div>
</header>

<section id="out"></section>

</div>

<script src="/assets/core.js"></script>
<script>
chrome_("/token/"); effects();

function row(label, value, cls){
  return `<div class="bar"><span>${label}</span><i><b style="width:0"></b></i>
          <u style="${cls||''}">${value}</u></div>`;
}

function render(r){
  const out = $("#out"); out.innerHTML = "";
  if (!r || r.error){ out.append(emptyBox("Scan failed.", r && r.error ? r.error : "Try again in a moment.")); return; }

  const risk = r.risk || {}, mk = r.market || {}, b = r.bundles || {}, rc = r.rugcheck || {};
  const rs = risk.score;
  const col = rs == null ? "var(--faint)" : rs >= 50 ? "var(--red)" : rs >= 25 ? "var(--gold)" : "var(--green)";

  const head = el("div","card");
  head.innerHTML =
    `<div class="card-top">
       <div><div class="sym">${r.token_symbol || "???"}</div>
         <div class="mint">${r.token_name || ""} &middot; ${short(r.mint)}</div></div>
       <div class="score" style="color:${col}">${rs == null ? "n/a" : rs}<small>RISK</small></div>
     </div>
     <div class="meta">
       <span class="tag chaintag" style="display:inline-flex;align-items:center;padding:3px 9px 3px 5px"></span>
       ${mk.market_cap ? `<span class="tag">${usd(mk.market_cap)} mcap</span>` : ""}
       ${mk.liquidity ? `<span class="tag">${usd(mk.liquidity)} liq</span>` : ""}
       ${risk.level ? `<span class="tag ${rs>=50?"bad":rs>=25?"warn":"good"}">${risk.level}</span>` : ""}
       ${r.depth ? `<span class="tag">${r.depth} scan</span>` : ""}
       ${r._cache === "hit" ? `<span class="tag">cached</span>` : ""}
     </div>`;
  out.append(head);
  const ct = head.querySelector(".chaintag");
  if (ct) ct.append(chainChip(r.chain, { size: "sm" }));

  const cr = r.chain_resolution;
  if (cr && cr.alternatives && cr.alternatives.length){
    const w = el("div","empty");
    w.style.cssText = "margin-top:12px;text-align:left;border-color:rgba(255,206,106,.32)";
    w.innerHTML = `<b>This address exists on more than one chain.</b>`
      + `Scanned on <b style="display:inline">${r.chain}</b>, the one with the deepest liquidity. `
      + `Also found on: ${cr.alternatives.join(", ")}. `
      + `Same address, different token. Make sure you mean this one.`;
    out.append(w);
  }

  // Wer steckt dahinter
  const who = el("div","card"); who.style.marginTop = "12px";
  const measured = b.measured !== false;
  who.innerHTML = `<h3>Who is behind it</h3>` + (measured ? `
    <div class="bars" style="margin-top:12px">
      ${row("clusters", (b.clusters||[]).length)}
      ${row("bundled supply", (b.bundled_supply_pct ?? 0).toFixed ? (b.bundled_supply_pct).toFixed(1)+"%" : "n/a")}
      ${row("snipers", b.sniper_count ?? "n/a")}
      ${row("fresh wallets", b.fresh_wallet_count ?? "n/a")}
      ${row("forwarded", b.forward_count ?? "n/a")}
      ${row("forwarded %", b.total_forwarded_pct != null ? b.total_forwarded_pct.toFixed(1)+"%" : "n/a")}
    </div>` : `
    <div class="empty" style="margin-top:12px"><b>Not measured.</b>
      This was a quick scan. Cluster and forward analysis did not run, which is
      not the same as finding nothing.</div>`);
  out.append(who);

  // Die Cluster selbst, mit Adressen.
  //
  // The page used to show only counts: "clusters 2". The bot showed the
  // actual wallets with timestamps and explorer links, and the bot is the
  // surface nobody can link to. This is the one that gets forwarded, so this
  // is where the evidence belongs. A number is a claim; an address with a
  // timestamp is something the reader can go and check.
  const clusters = b.clusters || [];
  if (measured && clusters.length) {
    const cl = el("div","card"); cl.style.marginTop = "12px";
    let html = `<h3>The clusters</h3>
      <p class="body" style="font-size:13px;margin:8px 0 0">
        Wallets that bought within the same window and were funded from the
        same place. Every address links to the explorer.</p>`;
    clusters.slice(0, 6).forEach((c, i) => {
      const wallets = (c.wallets || []).map(w =>
        typeof w === "string" ? w : (w.address || w.wallet)).filter(Boolean);
      const pct = c.supply_pct != null ? c.supply_pct : c.pct;
      const when = c.slot_time || c.seen_at || c.time;
      html += `<div style="margin-top:16px">
        <div style="font-family:var(--mono);font-size:12px;color:var(--ink)">
          Cluster ${i + 1} · ${c.wallet_count || wallets.length} wallets`
        + (pct != null ? ` · ${Number(pct).toFixed(1)}% supply` : "")
        + (when ? ` · ${when}` : "") + `</div>`;
      wallets.slice(0, 8).forEach(w => {
        html += `<div style="font-family:var(--mono);font-size:12px;
                    color:var(--dim);padding-left:14px;margin-top:3px">
          └ <a href="${scanLink(w, r.chain || "solana")}"
               target="_blank" rel="noopener">${short(w)}</a></div>`;
      });
      if (wallets.length > 8) {
        html += `<div style="font-family:var(--mono);font-size:12px;
                    color:var(--faint);padding-left:14px">
          └ +${wallets.length - 8} more</div>`;
      }
      // The funder is the part a cluster count cannot carry: three wallets
      // sharing one source is a different fact from three wallets.
      if (c.funder) {
        html += `<div style="font-family:var(--mono);font-size:11px;
                    color:var(--faint);padding-left:14px;margin-top:4px">
          └ funded by <a href="${scanLink(c.funder, r.chain || "solana")}"
               target="_blank" rel="noopener">${short(c.funder)}</a></div>`;
      }
      html += `</div>`;
    });
    if (clusters.length > 6) {
      html += `<p class="body" style="font-size:12px;margin-top:14px">
        ${clusters.length - 6} more clusters not shown.</p>`;
    }
    cl.innerHTML = html;
    out.append(cl);
  }

  // Woher das Geld kam.
  //
  // The strongest thing this scanner produces and the hardest for anyone to
  // copy: it needs months of scans in an archive. A cluster says three
  // wallets share a funder; this says what else that funder has paid for.
  const fh = r.funder_history || [];
  if (fh.length) {
    const fc = el("div","card"); fc.style.marginTop = "12px";
    let html = `<h3>Where the money came from</h3>`;
    fh.slice(0, 4).forEach(f => {
      html += `<div style="margin-top:14px">
        <div style="font-family:var(--mono);font-size:12px">
          <a href="${scanLink(f.funder, r.chain || "solana")}"
             target="_blank" rel="noopener">${short(f.funder)}</a>
          <span style="color:var(--dim)"> funded ${f.wallets_here || "?"}
          wallets here</span></div>
        <div class="body" style="font-size:13px;margin-top:4px;
             padding-left:14px">${f.verdict || ""}</div></div>`;
    });
    fc.innerHTML = html;
    out.append(fc);
  }

  // Vertrag
  const c = r.contract || {}, con = el("div","card"); con.style.marginTop = "12px";
  const flag = (k,label) => {
    const v = c[k];
    if (v === undefined || v === null) return `<span class="tag">${label} unknown</span>`;
    return v ? `<span class="tag bad">${label} LIVE</span>` : `<span class="tag good">${label} revoked</span>`;
  };
  con.innerHTML = `<h3>Contract</h3><div class="meta" style="margin-top:12px">
      ${flag("mint_authority","mint authority")}
      ${flag("freeze_authority","freeze authority")}
      ${rc.lp_locked_pct != null ? `<span class="tag ${rc.lp_locked_pct>=50?"good":"warn"}">LP locked ${rc.lp_locked_pct.toFixed(0)}%</span>` : ""}
      ${rc.top_holder_pct != null ? `<span class="tag ${rc.top_holder_pct>=20?"warn":""}">top holder ${rc.top_holder_pct.toFixed(1)}%</span>` : ""}
    </div>`;
  out.append(con);

  // Smart money auf diesem Token
  loadBuyers(r.mint, out);

  out.append(handoff(r.mint));

  const links = el("div"); links.style.cssText = "margin-top:18px;font-family:var(--mono);font-size:11px";
  links.innerHTML = `<a href="https://solscan.io/token/${r.mint}" target="_blank" rel="noopener">Solscan</a>
    &nbsp;/&nbsp; <a href="https://dexscreener.com/${r.chain || (String(r.mint).startsWith("0x") ? "base" : "solana")}/${r.mint}" target="_blank" rel="noopener">Dexscreener</a>
    &nbsp;/&nbsp; <a href="/how/">How this is measured</a>`;
  out.append(links);
}

async function loadBuyers(mint, out){
  try{
    const d = await api("/v1/token/" + mint + "/smart-money");
    if (!d.buyers || !d.buyers.length) return;
    const box = el("div","card"); box.style.marginTop = "12px";
    box.innerHTML = `<h3>Rated wallets that bought this</h3>`;
    const t = el("table","tbl"); t.style.marginTop = "12px";
    t.innerHTML = `<thead><tr><th>WALLET</th><th>LABEL</th><th class="n">SCORE</th>
      <th class="n">SOL</th><th class="n">WHEN</th></tr></thead>`;
    const tb = el("tbody");
    d.buyers.forEach(w => {
      const tr = el("tr");
      tr.innerHTML = `<td><a href="/wallet/?a=${w.wallet}">${short(w.wallet)}</a></td>
        <td style="color:var(--dim)">${(w.label||"").replace(/_/g," ")}</td>
        <td class="n" style="font-weight:700">${w.puter_score ?? "n/a"}</td>
        <td class="n">${(w.sol||0).toFixed(2)}</td>
        <td class="n" style="color:var(--faint)">${ago(w.bought_at)}</td>`;
      tb.append(tr);
    });
    t.append(tb); box.append(t); out.append(box);
  }catch(e){}
}

async function run(mint){
  mint = (mint||"").trim();
  if (!mint) return;
  $("#scan").disabled = true;
  traceReset("SCANNING");
  try{
    // Which chain first. An EVM address looks the same everywhere, so this is
    // asked rather than guessed: scanning the wrong chain returns an empty
    // report, and an empty report reads like a clean one.
    traceAdd("asking every chain which one trades this address");
    let chain = null;
    try{
      const res = await api("/v1/resolve?address=" + encodeURIComponent(mint));
      chain = res.chain;
      if (res.reason) traceAdd(res.reason);
      if (res.alternatives && res.alternatives.length){
        traceAdd("also present on: " + res.alternatives.join(", "), true);
      }
      if (!chain){
        $("#traceTitle").textContent = "STOPPED";
        const d = $("#trace .dot"); if (d) d.style.animation = "none";
        render({error: res.reason || "Could not place that address on any chain we cover."});
        $("#scan").disabled = false;
        return;
      }
    }catch(e){ traceAdd("chain lookup unavailable, letting the scanner decide"); }

    traceAdd("running FINNPUTER safety engine");
    traceAdd("this takes up to 90 seconds on a first scan");
    const body = chain ? {mint, depth:"deep", chain} : {mint, depth:"deep"};
    const r = await api("/v1/scan", {method:"POST", body: JSON.stringify(body)});
    $("#traceTitle").textContent = "DONE";
    const d = $("#trace .dot"); if (d) d.style.animation = "none";
    traceAdd(r._cache === "hit" ? "served from cache" : "scan complete", true);
    render(r);
    history.replaceState(null,"","/token/?m="+encodeURIComponent(mint));
  }catch(e){
    $("#traceTitle").textContent = "FAILED";
    render({error:"CORE API did not answer, or that address is not supported."});
  }
  $("#scan").disabled = false;
}

$("#scan").addEventListener("click", () => run($("#mint").value));
$("#mint").addEventListener("keydown", e => { if (e.key === "Enter") run($("#mint").value); });

const pre = qs("m");
if (pre){ $("#mint").value = pre; run(pre); }
</script>
</body>
</html>
